# Example card exported from the approved Energie TMP Live Energy Topology.
# Replace every sensor.example_* placeholder before use. See examples/README.md.
# Requires custom:button-card. Keep the SVG paths, breakpoints, Motion Path and
# Safari 15 / iPadOS 15 SMIL fallback together when adapting the example.

type: custom:button-card
show_icon: false
show_name: true
tap_action:
  action: none
hold_action:
  action: none
triggers_update:
- sensor.example_p1_active_power
- sensor.example_p1_energy_import_total
- sensor.example_p1_energy_export_total
- sensor.example_grid_import_cost_total
- sensor.example_grid_export_revenue_total
- sensor.example_saj_pv_power
- sensor.example_saj_pv_energy_total
- sensor.example_saj_load_power
- sensor.example_house_power
- sensor.example_saj_load_energy_total
- sensor.example_house_energy_today
- sensor.example_house_cost_today
- sensor.example_saj_ev_charger_power
- sensor.example_saj_ev_charger_total_energy
- sensor.example_ev_battery_level
- sensor.example_saj_battery_power
- sensor.example_saj_battery_direction_code
- sensor.example_saj_battery_soc
- sensor.example_saj_battery_charge_energy_total
- sensor.example_saj_battery_discharge_energy_total
- sensor.example_saj_grid_power
- sensor.example_saj_grid_direction_code
- sensor.example_external_battery_power
- sensor.example_external_battery_charge_energy_total
- sensor.example_external_battery_discharge_energy_total
- sensor.example_external_battery_discharge_energy_today
- sensor.example_external_battery_charge_energy_today
- sensor.example_external_battery_result_today
- sensor.example_external_battery_soc
- sensor.example_grid_import_energy_today
- sensor.example_grid_import_cost_today
- sensor.example_grid_export_energy_today
- sensor.example_grid_export_revenue_today
- sensor.example_saj_grid_import_energy_today
- sensor.example_saj_grid_export_energy_today
- sensor.example_external_battery_charge_energy_today
- sensor.example_external_battery_discharge_energy_today
- sensor.example_accounted_house_energy_today
- sensor.example_accounted_house_cost_today
- sensor.example_accounted_ev_energy_today
- sensor.example_accounted_ev_cost_today
grid_options:
  columns: full
  rows: auto
styles:
  card:
  - padding: 0
  - overflow: hidden
  - border-radius: 22px
  - border: 1px solid rgba(45, 60, 67, 0.2)
  - background: "#d2d2cf"
  - box-shadow: 0 18px 42px rgba(43, 52, 55, 0.16), inset 0 1px 0 rgba(255, 255, 255,
      0.58)
  grid:
  - grid-template-areas: '"n"'
  - grid-template-columns: 1fr
  name:
  - width: 100%
  - white-space: normal
  - display: block
  - padding: 0
  - margin: 0
  - text-align: left
name: |-
  [[[
    const n = (id, fallback = 0) => {
      const value = Number(states[id]?.state);
      return Number.isFinite(value) ? value : fallback;
    };
    const watts = value => {
      const abs = Math.abs(value);
      return abs >= 1000
        ? `${(abs / 1000).toFixed(abs >= 10000 ? 1 : 2)} kW`
        : `${Math.round(abs)} W`;
    };
    const euro = value => Number.isFinite(value) ? `${value >= 0 ? '+' : '−'}€ ${Math.abs(value).toFixed(2)}` : '—';
    const kwh = value => Number.isFinite(value) ? `${value.toFixed(2)} kWh` : '—';
    const nl = (value, digits = 2) => Number.isFinite(value)
      ? value.toLocaleString('nl-NL', { minimumFractionDigits: digits, maximumFractionDigits: digits })
      : '—';
    const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const clamp = value => Number.isFinite(value) ? Math.max(0, Math.min(100, value)) : 0;

    const p1 = n('sensor.example_p1_active_power');
    const nexus = n('sensor.example_external_battery_power');
    const nexusSoc = clamp(n('sensor.example_external_battery_soc', NaN));
    const nexusImportToday = n('sensor.example_external_battery_charge_energy_today', NaN);
      const nexusExportToday = n('sensor.example_external_battery_discharge_energy_today', NaN);
      const sajGridImportToday = n('sensor.example_saj_grid_import_energy_today', NaN);
      const sajGridExportToday = n('sensor.example_saj_grid_export_energy_today', NaN);
    const nexusResultToday = n('sensor.example_external_battery_result_today', NaN);
    const netImportToday = n('sensor.example_grid_import_energy_today', NaN);
    const netImportCostToday = n('sensor.example_grid_import_cost_today', NaN);
    const netExportToday = n('sensor.example_grid_export_energy_today', NaN);
    const netExportRevenueToday = n('sensor.example_grid_export_revenue_today', NaN);

    const sajGrid = n('sensor.example_saj_grid_power');
    const sajGridDirection = n('sensor.example_saj_grid_direction_code');
    const pv = n('sensor.example_saj_pv_power');
    const sajBattery = n('sensor.example_saj_battery_power');
    const sajBatteryDirection = n('sensor.example_saj_battery_direction_code');
    const sajSoc = clamp(n('sensor.example_saj_battery_soc', NaN));
    const home = n('sensor.example_house_power');
    const monitoredToday = n('sensor.example_house_energy_today', NaN);
    const monitoredCostToday = n('sensor.example_house_cost_today', NaN);
    const ev = n('sensor.example_saj_ev_charger_power');
    const evSocRaw = n('sensor.example_ev_battery_level', NaN);
    const evSocKnown = Number.isFinite(evSocRaw);
    const evSoc = clamp(evSocRaw);

    const threshold = 25;
  const homeKnown = Number.isFinite(home);
  const homeStatus = homeKnown ? (home > threshold ? 'Verbruik' : 'Rust') : (Number.isFinite(ev) && ev >= threshold ? 'Niet beschikbaar tijdens EV-laden' : 'Tijdelijk niet beschikbaar');
  const homeValue = homeKnown ? watts(home) : '\u0014';
    const duration = power => Math.abs(power) >= 7000 ? 1.25 : Math.abs(power) >= 2500 ? 1.75 : 2.6;
    let flowIndex = 0;
    const motionPathSupported = typeof CSS !== 'undefined'
      && typeof CSS.supports === 'function'
      && CSS.supports('offset-path', "path('M0 0 L1 1')")
      && CSS.supports('offset-distance', '100%');
    const prefersReducedMotion = typeof window !== 'undefined'
      && typeof window.matchMedia === 'function'
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const flow = (path, power, active, family, forward = true, isolated = false) => {
      const id = `schematic-flow-${++flowIndex}`;
      const tone = active ? family : 'idle';
      const seconds = duration(power);
      const direction = forward ? 'forward' : 'reverse';
      const ball = !active ? '' : motionPathSupported
        ? `<circle r="7" class="flow-ball ${family} ${direction}" style="offset-path:path('${path}');--duration:${seconds}s"/>`
        : `<circle r="7" class="flow-ball ${family} ${direction} smil-fallback" style="--duration:${seconds}s"><animateMotion dur="${prefersReducedMotion ? 4.5 : seconds}s" repeatCount="indefinite" calcMode="linear" keyPoints="${forward ? '0;1' : '1;0'}" keyTimes="0;1" rotate="0"><mpath href="#${id}" xlink:href="#${id}"/></animateMotion></circle>`;
      return `${isolated ? `<path d="${path}" class="wire-separator"/>` : ''}<path id="${id}" d="${path}" class="wire ${tone}"/>${ball}`;
    };

    const p1Active = Math.abs(p1) > threshold;
    const p1Family = p1 >= 0 ? 'red' : 'green';
    const p1Forward = p1 >= 0;
  const fmtFlowPower = p => p >= 1000 ? (p / 1000).toFixed(2) + ' kW' : Math.round(p) + ' W';
  const flowPowerLabel = (x,y,p,a,f) => {
    if (!a) return '';
    const c = f === 'green' ? '#078b35' : '#b01731';
    return '<g><rect x="'+(x-52)+'" y="'+(y-17)+'" width="104" height="34" rx="7" fill="#8d8e8f" fill-opacity="0.58" stroke="'+c+'" stroke-width="2"/><text x="'+x+'" y="'+(y+1)+'" text-anchor="middle" dominant-baseline="middle" style="font:700 17px Arial,sans-serif;fill:#fff">'+fmtFlowPower(p)+'</text></g>';
  };

  const nexusActive = Math.abs(nexus) > threshold;
    const nexusFamily = nexus >= 0 ? 'red' : 'green';
    const nexusForward = nexus < 0;

    const sajGridKnown = sajGridDirection === -1 || sajGridDirection === 1;
    const sajGridActive = sajGrid > threshold && sajGridKnown;
    const sajGridImport = sajGridDirection === -1;
    const sajGridFamily = sajGridImport ? 'red' : 'green';
    const sajGridForward = sajGridImport;

    const sajBatteryKnown = sajBatteryDirection === -1 || sajBatteryDirection === 1;
    const sajBatteryActive = sajBattery > threshold && sajBatteryKnown;
    const sajBatteryCharging = sajBatteryDirection === -1;
    const sajBatteryFamily = sajBatteryCharging ? 'red' : 'green';
    const sajBatteryForward = sajBatteryCharging;

    const homeActive = homeKnown && home > threshold;
    const evActive = ev > threshold;
    const pvActive = pv > threshold;

    const p1Mode = !p1Active ? 'Rust' : p1 > 0 ? 'Import' : 'Export';
    const nexusMode = !nexusActive ? 'Rust' : nexus > 0 ? 'Laden' : 'Ontladen';
    const sajGridMode = !sajGridActive ? 'Net rust' : sajGridImport ? 'Netimport' : 'Netexport';
    const sajBatteryMode = !sajBatteryActive ? 'Rust' : sajBatteryCharging ? 'Laden' : 'Ontladen';

    // Bronverdeling aan de eManager-grens. Dit gebruikt uitsluitend de bestaande,
    // gevalideerde topologie P1 = Nexus + signed SAJ-grid; er worden geen nieuwe
    // Home Assistant-sensoren of energietellers aangemaakt.
    const sajGridSigned = sajGridKnown ? (sajGridImport ? sajGrid : -sajGrid) : 0;
    const sajBranchImport = Math.max(sajGridSigned, 0);
    const sajBranchExport = Math.max(-sajGridSigned, 0);
    const nexusDischarge = Math.max(-nexus, 0);
    const nexusCharge = Math.max(nexus, 0);
    const zonneplanIntoEmanager = Math.min(nexusDischarge, sajBranchImport);
    const netIntoEmanager = Math.max(sajBranchImport - zonneplanIntoEmanager, 0);
    const emanagerToZonneplan = Math.min(nexusCharge, sajBranchExport);
    const emanagerToNet = Math.max(sajBranchExport - emanagerToZonneplan, 0);
  const smartToZonneplan = Math.max(nexusCharge - emanagerToZonneplan, 0);
  const zonneplanToSmart = Math.max(nexusDischarge - zonneplanIntoEmanager, 0);
  const zonneplanSmartPower = Math.max(smartToZonneplan, zonneplanToSmart);
  const zonneplanSmartActive = zonneplanSmartPower > threshold;
  const zonneplanSmartFamily = smartToZonneplan > threshold ? 'red' : zonneplanToSmart > threshold ? 'green' : 'idle';
  const zonneplanSmartForward = smartToZonneplan > threshold;
    const zonneplanEmanagerPower = Math.max(zonneplanIntoEmanager, emanagerToZonneplan);
    const zonneplanEmanagerActive = zonneplanEmanagerPower > threshold;
    const zonneplanEmanagerFamily = zonneplanIntoEmanager > threshold ? 'green' : emanagerToZonneplan > threshold ? 'red' : 'idle';
    const zonneplanEmanagerForward = zonneplanIntoEmanager > threshold;
      // Alleen het resterende Nexus-vermogen loopt rechtstreeks naar/vanaf de slimme meter.

    const netEmanagerPower = Math.max(netIntoEmanager, emanagerToNet);
    const netEmanagerActive = netEmanagerPower > threshold;
    const netEmanagerFamily = netIntoEmanager > threshold ? 'red' : emanagerToNet > threshold ? 'green' : 'idle';
    const netEmanagerForward = netIntoEmanager > threshold;
    const pvIntoEmanager = Math.max(pv, 0);
    const sajBatteryIntoEmanager = sajBatteryKnown && !sajBatteryCharging ? sajBattery : 0;
    const emanagerToSajBattery = sajBatteryKnown && sajBatteryCharging ? sajBattery : 0;

    const directionValue = (importPower, exportPower, importFamily, exportFamily) => {
      if (importPower > threshold) return { text: `Import · ${watts(importPower)}`, family: importFamily };
      if (exportPower > threshold) return { text: `Export · ${watts(exportPower)}`, family: exportFamily };
      return { text: 'Rust · 0 W', family: 'idle' };
    };
    const emanagerFlows = [
      ['Net', directionValue(netIntoEmanager, emanagerToNet, 'red', 'green')],
      ['Zonneplan', directionValue(zonneplanIntoEmanager, emanagerToZonneplan, 'green', 'red')],
      ['Zonnepanelen', directionValue(pvIntoEmanager, 0, 'green', 'idle')],
      ['SAJ-batterij', directionValue(sajBatteryIntoEmanager, emanagerToSajBattery, 'green', 'red')],
    ];

    const tileCopy = (x, y, width, title, status, power, detail = '', family = 'idle') => `
      <g class="tile-copy ${family}">
        <text x="${x + width / 2}" y="${y + 122}" class="tile-title">${esc(title)}</text>
        <text x="${x + width / 2}" y="${y + 147}" class="tile-status">${esc(status)}</text>
        <text x="${x + width / 2}" y="${y + 176}" class="tile-power">${esc(power)}</text>
        ${detail ? `<text x="${x + width / 2}" y="${y + 197}" class="tile-detail">${esc(detail)}</text>` : ''}
      </g>`;

    const mobileTileCopy = (x, y, width, title, status, power, detail = '', family = 'idle') => `
      <g class="tile-copy mobile-copy ${family}">
        <text x="${x + width / 2}" y="${y + 126}" class="tile-title">${esc(title)}</text>
        <text x="${x + width / 2}" y="${y + 154}" class="tile-status">${esc(status)}</text>
        <text x="${x + width / 2}" y="${y + 188}" class="tile-power">${esc(power)}</text>
        ${detail ? `<text x="${x + width / 2}" y="${y + 213}" class="tile-detail">${esc(detail)}</text>` : ''}
      </g>`;

    const tabletTileCopy = (x, y, width, title, status, power, family = 'idle') => `
      <g class="tile-copy tablet-copy ${family}">
        <text x="${x + width / 2}" y="${y + 95}" class="tile-title">${esc(title)}</text>
        <text x="${x + width / 2}" y="${y + 119}" class="tile-status">${esc(status)}</text>
        <text x="${x + width / 2}" y="${y + 145}" class="tile-power">${esc(power)}</text>
      </g>`;

    const metric = (label, value, tone = '') => ({ label, value, tone });
    const dayFmt = value => Number.isFinite(value) ? (Math.round(value * 100) / 100).toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
      const dayKwh = value => Number.isFinite(value) ? `${dayFmt(value)} kWh` : '-';
      const dayRows = [
        { label: 'Totaal net', tone: 'mixed', energy: [metric('Import', dayKwh(netImportToday), 'cost'), metric('Export', dayKwh(netExportToday), 'gain')], money: [metric('Kosten', `- EUR ${dayFmt(netImportCostToday)}`, 'cost'), metric('Opbrengst', `+ EUR ${dayFmt(netExportRevenueToday)}`, 'gain')] },
        { label: 'SAJ eManager', tone: 'mixed', energy: [metric('Import', dayKwh(sajGridImportToday), 'cost'), metric('Export', dayKwh(sajGridExportToday), 'gain')], money: [metric('Kosten', '-', 'idle'), metric('Opbrengst', '-', 'idle')] },
        { label: 'Zonneplan batterij', tone: 'mixed', energy: [metric('Import', dayKwh(nexusImportToday), 'cost'), metric('Export', dayKwh(nexusExportToday), 'gain')], money: [metric('Kosten', '-', 'idle'), metric('Opbrengst', '-', 'idle')] },
        { label: 'SAJ 10 kWh', tone: 'idle', energy: [metric('Laden vandaag', kwh(Number(states['sensor.example_saj_battery_charge_energy_today']?.state)), 'cost'), metric('Ontladen vandaag', 'Nog niet bewezen', 'idle')], money: [metric('Financieel', '—', 'idle')] },
        { label: 'Huis', tone: 'cost', energy: [metric('Vandaag', kwh(Number(states['sensor.example_accounted_house_energy_today']?.state)), 'cost')], money: [metric('Kosten', euro(-Number(states['sensor.example_accounted_house_cost_today']?.state)), 'cost')] },
        { label: 'Zonnepanelen', tone: 'gain', energy: [metric('Productie vandaag', kwh(Number(states['sensor.example_saj_pv_energy_today']?.state)), 'gain')], money: [metric('Financieel', '—', 'idle')] },
        { label: 'EV-lader', tone: 'cost', energy: [metric('Vandaag', kwh(Number(states['sensor.example_accounted_ev_energy_today']?.state)), 'cost')], money: [metric('Kosten', euro(-Number(states['sensor.example_accounted_ev_cost_today']?.state)), 'cost')] },
      ];
    const renderMetrics = items => items.map(item => `<div class="metric-row ${item.tone}"><span class="metric-label">${esc(item.label)}</span><span class="metric-value">${esc(item.value)}</span></div>`).join('');
    const componentCard = row =>   `<article class="component-card ${esc(row.tone)}">
      <div class="component-card-title"><span class="component-dot"></span>${esc(row.label)}</div>
      <div class="component-card-section">Energie</div>
      ${renderMetrics(row.energy)}
      <div class="component-card-section">Kosten / opbrengst</div>
      ${renderMetrics(row.money)}
    </article>`;

    const componentGroups = [
      { title: 'Netuitwisseling', subtitle: 'Totaal en de twee fysieke energietakken', rows: dayRows.slice(0, 3) },
      { title: 'Opslag en opwek', subtitle: 'SAJ-batterij en zonnepanelen', rows: dayRows.slice(3, 4).concat(dayRows.slice(5, 6)) },
      { title: 'Verbruik', subtitle: 'Woning en elektrisch laden', rows: dayRows.slice(4, 5).concat(dayRows.slice(6, 7)) }
    ];

    const dayTable = `<section class="component-overview" aria-label="Dagwaarden per energiecomponent">
      <header class="component-overview-header">
        <div>
          <div class="component-overview-title">Energiecomponenten</div>
          <div class="component-overview-subtitle">DAGWAARDEN PER LOGISCHE GROEP</div>
        </div>
        <span class="component-overview-badge">7 componenten</span>
      </header>
      <div class="component-groups">
        ${componentGroups.map(group => `<section class="component-group">
          <header class="component-group-header"><div class="component-group-title">${esc(group.title)}</div><div class="component-group-subtitle">${esc(group.subtitle)}</div></header>
          <div class="component-card-grid">${group.rows.map(componentCard).join('')}</div>
        </section>`).join('')}
      </div>
      <div class="component-overview-note">Totaal net is de uitwisseling met het openbare net. SAJ eManager en Zonneplan batterij meten bruto via het interne energieknooppunt; onderlinge stroom kan daardoor op beide takken voorkomen en valt netto weg op P1. Tel takwaarden daarom niet op bij Totaal net.</div>
    </section>`;

    const commonDefs = `
      <defs>
        <linearGradient id="carrier" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b454a"/><stop offset=".55" stop-color="#20292d"/><stop offset="1" stop-color="#11171a"/></linearGradient>
        <linearGradient id="controlCarrier" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30266b"/><stop offset=".55" stop-color="#181447"/><stop offset="1" stop-color="#0f0d2d"/></linearGradient>
        <linearGradient id="batteryLevel" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#19b792"/><stop offset="1" stop-color="#61e1c9"/></linearGradient>
      </defs>`;

    return `
      <style>
        .energy-schematic{position:relative;box-sizing:border-box;padding:20px 20px 14px;overflow:hidden;background:#fff;color:#18262b;font-family:var(--paper-font-body1_-_font-family,Inter,system-ui,sans-serif)}
        .energy-schematic:before{content:"";position:absolute;inset:-20%;pointer-events:none;background:none;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:0 6px 10px}
        .schematic-title{font-size:30px;font-weight:850;letter-spacing:-.03em;color:#18262b}.schematic-sub{margin-top:4px;font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#596a70}
        .schematic-legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.legend{padding:7px 11px;border-radius:999px;border:1px solid rgba(43,57,63,.18);background:rgba(255,255,255,.55);font-size:12px;font-weight:750;color:#394b51}.legend:before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%}.legend.green:before{background:#0ff804;box-shadow:0 0 7px rgba(15,248,4,.55)}.legend.red:before{background:#ff032d;box-shadow:0 0 7px rgba(255,3,45,.4)}
        .today-panel{position:relative;z-index:3;width:100%;box-sizing:border-box;margin-top:14px;padding:13px;border:1px solid rgba(43,57,63,.2);border-radius:18px;background:rgba(246,247,244,.94);box-shadow:0 10px 28px rgba(31,42,46,.14);backdrop-filter:blur(8px);color:#24343a}
        .today-panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}.today-title{font-size:21px;font-weight:850;line-height:1.15}.today-subtitle{margin-top:4px;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#68787d}.today-badge{padding:5px 10px;border-radius:999px;background:#e4ebea;border:1px solid rgba(43,57,63,.12);font-size:11px;font-weight:800;color:#53656a}
        .today-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.today-card{position:relative;overflow:hidden;min-width:0;padding:11px 12px 10px;border:1px solid rgba(43,57,63,.13);border-radius:11px;background:#fff;box-shadow:0 3px 9px rgba(31,42,46,.07)}.today-card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#52666c}.today-card.gain:before{background:#159431}.today-card.cost:before{background:#c2203b}.today-card.mixed:before{background:linear-gradient(#159431 0 50%,#c2203b 50% 100%)}.today-card.idle:before{background:#899396}.today-card-title{display:flex;align-items:center;gap:7px;padding-left:2px;font-size:14px;font-weight:850;line-height:1.25;color:#213238}.component-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#52666c}.today-card.gain .component-dot{background:#159431}.today-card.cost .component-dot{background:#c2203b}.today-card.mixed .component-dot{background:linear-gradient(135deg,#159431 0 50%,#c2203b 50% 100%)}.today-card.idle .component-dot{background:#899396}.metric-group{margin-top:8px;padding-top:7px;border-top:1px solid #e1e6e5}.metric-group.finance{margin-top:7px}.metric-kicker{margin-bottom:4px;font-size:9.5px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:#67777c}.metric-row{display:flex;align-items:baseline;justify-content:space-between;gap:7px;min-width:0;font-size:12px;line-height:1.45}.metric-label{flex:0 1 auto;color:#5c6d72}.metric-value{flex:0 1 auto;text-align:right;font-weight:800;color:#2d4147}.metric-row.gain .metric-value{color:#087b20}.metric-row.cost .metric-value{color:#b21732}.metric-row.idle .metric-value{color:#707d80;font-weight:700}.today-note{margin-top:10px;font-size:10.5px;line-height:1.45;color:#5d6d72}
        .schematic-svg{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible}.mobile-svg,.tablet-svg{display:none}
        .wire-separator{fill:none;stroke:#d2d2cf;stroke-width:16;stroke-linecap:round;stroke-linejoin:round}.wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s ease,opacity .3s ease}.wire.green{stroke:#087b20}.wire.red{stroke:#98152d}.wire.idle{stroke:#6a6465;opacity:.78}
        .flow-ball{offset-distance:0%;offset-rotate:0deg;animation:travel var(--duration) linear infinite;filter:drop-shadow(0 0 5px currentColor)}.flow-ball.reverse{animation-direction:reverse}.flow-ball.green{fill:#0ff804;color:#0ff804}.flow-ball.red{fill:#ff032d;color:#ff032d}@keyframes travel{to{offset-distance:100%}}.flow-ball.smil-fallback{animation:none}

