  .component-overview{position:relative;z-index:3;box-sizing:border-box;width:100%;margin-top:14px;padding:20px;background:#eef4f8;border:1px solid rgba(255,255,255,.78);border-radius:26px;box-shadow:0 14px 32px rgba(2,8,23,.22);color:#18262b}
